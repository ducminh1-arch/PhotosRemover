name: PhotosRemover
options:
  bundleIdPrefix: com.cleanpix
  deploymentTarget:
    iOS: "16.0"
  xcodeVersion: "15.0"
  createIntermediateGroups: true

settings:
  SWIFT_VERSION: "5.0"
  ENABLE_BITCODE: false
  IPHONEOS_DEPLOYMENT_TARGET: "16.0"

targets:
  PhotosRemover:
    type: application
    platform: iOS
    deploymentTarget: "16.0"
    sources:
      - path: PhotosRemover
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: com.cleanpix.photosremover
      PRODUCT_NAME: Remo
      MARKETING_VERSION: "1.0.0"
      CURRENT_PROJECT_VERSION: "1"
      INFOPLIST_FILE: PhotosRemover/App/Info.plist
      GENERATE_INFOPLIST_FILE: false
      TARGETED_DEVICE_FAMILY: "1,2"
      ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
      ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor

  PhotosRemoverTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: PhotosRemoverTests
    dependencies:
      - target: PhotosRemover
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: com.cleanpix.photosremoverTests
      PRODUCT_NAME: PhotosRemoverTests
      GENERATE_INFOPLIST_FILE: true
